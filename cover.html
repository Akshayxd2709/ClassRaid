<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; min-height: 720px; 
      background: #121418; color: #E2E8F0; 
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: 'Inter', sans-serif; position: relative;
    }
    .title-box { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .prompt { font-family: 'JetBrains Mono', monospace; font-size: 48px; color: #F5A623; font-weight: 700; }
    .display { font-family: 'JetBrains Mono', monospace; font-size: 48px; color: #F5A623; font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 20px; color: #94A3B8; font-weight: 400; letter-spacing: 0.05em; text-transform: uppercase; }
    .motif { position: absolute; bottom: 48px; right: 48px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #F5A623; font-weight: 500; }
    .accent-bar { width: 120px; height: 4px; background: #F5A623; margin-top: 32px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="title-box">
      <span class="prompt">></span>
      <h1 class="display">Backend Architecture</h1>
    </div>
    <p class="subtitle">ClassRaid Handoff & Technical Specification</p>
    <div class="accent-bar"></div>
    <div class="motif">[ 01 ]</div>
  </div>
</body>
</html>
